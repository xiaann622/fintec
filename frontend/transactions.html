<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transactions — M-Pesa Intelligence System</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar-root"></aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="page-title">Transactions</div>
        <div class="page-sub">Full transaction ledger with labels, classification and category applied.</div>
      </div>
    </div>

    <div class="card">
      <div class="toolbar">
        <input type="text" id="f-search" placeholder="Search details…" style="min-width:220px;" />
        <select id="f-label"><option value="">All labels</option></select>
        <select id="f-classification"><option value="">All classifications</option></select>
        <select id="f-category"><option value="">All categories</option></select>
        <input type="date" id="f-from" title="From date" />
        <input type="date" id="f-to" title="To date" />
        <button class="btn btn-secondary btn-sm" onclick="applyFilters()">Apply</button>
        <button class="btn btn-secondary btn-sm" onclick="resetFilters()">Reset</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Date</th><th>Receipt</th><th>Details</th><th>Paid In</th><th>Withdrawn</th>
            <th>Label</th><th>Classification</th><th>Category</th><th>Confidence</th>
          </tr></thead>
          <tbody id="txn-rows"><tr><td colspan="9" class="empty-state">Loading…</td></tr></tbody>
        </table>
      </div>

      <div class="pagination">
        <span id="page-info">—</span>
        <button class="btn btn-secondary btn-sm" onclick="prevPage()">◀ Prev</button>
        <button class="btn btn-secondary btn-sm" onclick="nextPage()">Next ▶</button>
      </div>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/transactions.js"></script>
</body>
</html>
