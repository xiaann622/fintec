<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trends & Patterns — M-Pesa Intelligence System</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar-root"></aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="page-title">Trends & Behavioural Patterns</div>
        <div class="page-sub">When transactions happen, how weekdays compare to weekends, and how activity moves through the month.</div>
      </div>
      <div class="toolbar" style="margin-bottom:0;">
        <select id="t-month"></select>
        <select id="t-year"></select>
      </div>
    </div>

    <div class="card section">
      <h3>Time of day <span class="tag">When do transactions happen?</span></h3>
      <div class="chart-box"><canvas id="chart-tod"></canvas></div>
    </div>

    <div class="grid grid-2 section">
      <div class="card">
        <h3>Weekday vs weekend</h3>
        <div class="chart-box small"><canvas id="chart-wkwd"></canvas></div>
      </div>
      <div class="card">
        <h3>Day-of-week pattern</h3>
        <div class="chart-box small"><canvas id="chart-dow"></canvas></div>
      </div>
    </div>

    <div class="card section">
      <h3>Monthly progression <span class="tag" id="month-progress-tag">First week → last week</span></h3>
      <div class="chart-box"><canvas id="chart-week-progress"></canvas></div>
    </div>

    <div class="card section">
      <h3>Full month history</h3>
      <div class="chart-box"><canvas id="chart-full-history"></canvas></div>
    </div>
  </main>
</div>

<script src="js/vendor/chart.umd.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/charts-common.js"></script>
<script src="js/trends.js"></script>
</body>
</html>
