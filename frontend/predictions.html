<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Predict a Transaction — M-Pesa Intelligence System</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar-root"></aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="page-title">Predict a Transaction</div>
        <div class="page-sub">Run the label → classification → category pipeline on a single transaction detail line — useful for testing or one-off lookups.</div>
      </div>
    </div>

    <div class="grid" style="grid-template-columns:1fr 1fr; gap:18px;">
      <div class="card">
        <h3>Transaction details</h3>
        <form id="predict-form">
          <div class="field">
            <label>Raw M-Pesa detail text</label>
            <textarea id="p-details" placeholder="e.g. Pay Bill to KPLC PREPAID 888880 Acc 123456" required></textarea>
          </div>
          <div class="grid grid-2">
            <div class="field">
              <label>Paid in (KES)</label>
              <input type="number" id="p-paidin" value="0" step="0.01" />
            </div>
            <div class="field">
              <label>Withdrawn (KES)</label>
              <input type="number" id="p-withdrawn" value="0" step="0.01" />
            </div>
          </div>
          <div class="field">
            <label>Completion time (optional — defaults to now)</label>
            <input type="datetime-local" id="p-time" />
          </div>
          <button class="btn btn-primary" type="submit" id="predict-btn">Run pipeline</button>
        </form>
      </div>

      <div class="card">
        <h3>Prediction result</h3>
        <div id="predict-result" class="empty-state">Submit a transaction to see label, classification and category predictions here.</div>
      </div>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/predictions.js"></script>
</body>
</html>
